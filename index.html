<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simu-KM | Simulator Kelistrikan Motor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .hidden { display: none; }
        
        /* Gaya Layar Login */
        .login-box { text-align: center; max-width: 300px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 5px; font-weight: bold; }
        button.register-btn { background-color: #2ecc71; }
        button:hover { opacity: 0.9; }

        /* Gaya Menu Utama */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-card { background: #ecf0f1; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .menu-card:hover { border-color: #3498db; background: #e0f7fa; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; margin-bottom: 20px; }
        .logout-btn { background-color: #e74c3c; width: auto; padding: 5px 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- LAYAR LOGIN -->
    <div id="login-screen">
        <h1>Masuk ke Simu-KM</h1>
        <p style="text-align:center;">Trainer Kit Kelistrikan Sepeda Motor Digital</p>
        <div class="login-box">
            <input type="email" id="email-input" placeholder="Masukkan Email Siswa/Guru">
            <input type="password" id="password-input" placeholder="Masukkan Password">
            <button id="btn-login">Login</button>
            <p style="font-size: 12px; margin: 10px 0;">Belum punya akun?</p>
            <button id="btn-register" class="register-btn">Daftar Baru</button>
        </div>
    </div>

    <!-- LAYAR MENU UTAMA (Sembunyi sebelum login) -->
    <div id="main-screen" class="hidden">
        <div class="header-bar">
            <h2>Dashboard Simu-KM</h2>
            <button id="btn-logout" class="logout-btn">Keluar</button>
        </div>
        <p>Selamat datang! Silakan pilih menu pembelajaran hari ini:</p>
        
        <div class="menu-grid">
            <div class="menu-card" onclick="alert('Fitur Materi akan segera hadir!')">📖 Materi & Modul Ajar</div>
            <div class="menu-card" onclick="alert('Fitur Video Tutorial akan segera hadir!')">🎥 Video Tutorial</div>
            <div class="menu-card" onclick="alert('Fitur Latihan & Jobsheet akan segera hadir!')">📝 Latihan Soal & Jobsheet</div>
            <div class="menu-card" onclick="alert('Membuka Ruang Simulator...')">⚙️ Simulator Praktik Bebas</div>
            <div class="menu-card" style="grid-column: span 2; background-color: #ffeaa7;" onclick="alert('Halo! Saya AI Asisten Simu-KM. Ada yang bisa dibantu?')">🤖 Tanya AI (Asisten Pintar)</div>
        </div>
    </div>
</div>

<!-- KODE FIREBASE DARI ANDA -->
<script type="module">
    // Mengimpor library Firebase yang dibutuhkan (App, Auth, Analytics)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    // Konfigurasi Kunci Firebase Anda
    const firebaseConfig = {
        apiKey: "AIzaSyDI9Rd4m4IxKJsELGS9e7KztVS2hXftAA0",
        authDomain: "simu-km.firebaseapp.com",
        projectId: "simu-km",
        storageBucket: "simu-km.firebasestorage.app",
        messagingSenderId: "110115174829",
        appId: "1:110115174829:web:adf0d44a268076a3954924",
        measurementId: "G-5FKCSG9Y2D"
    };

    // Inisialisasi Aplikasi
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    // MENGATUR TAMPILAN LAYAR (UI)
    const loginScreen = document.getElementById('login-screen');
    const mainScreen = document.getElementById('main-screen');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');

    // CEK STATUS LOGIN: Jika login tampilkan menu, jika belum tampilkan form
    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
        } else {
            loginScreen.classList.remove('hidden');
            mainScreen.classList.add('hidden');
        }
    });

    // FUNGSI TOMBOL LOGIN
    document.getElementById('btn-login').addEventListener('click', () => {
        signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
            .then(() => alert("Berhasil Login!"))
            .catch((error) => alert("Gagal Login: " + error.message));
    });

    // FUNGSI TOMBOL DAFTAR
    document.getElementById('btn-register').addEventListener('click', () => {
        createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
            .then(() => alert("Akun berhasil dibuat! Silakan gunakan di aplikasi."))
            .catch((error) => alert("Gagal Mendaftar: " + error.message));
    });

    // FUNGSI TOMBOL LOGOUT
    document.getElementById('btn-logout').addEventListener('click', () => {
        signOut(auth).catch((error) => alert(error.message));
    });
</script>

</body>
</html>
